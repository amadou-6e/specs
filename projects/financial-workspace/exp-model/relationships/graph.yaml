  "invariants": [
    "Statement and transaction account IDs must agree.",
    "No receipt match duplicates a posted movement.",
    "Unknown and unclassified transactions remain in the sheet.",
    "Refunds retain separate transaction identity.",
    "Each Balance item belongs to exactly one Account or Liability.",
    "Budgets and forecasts never create cash movements or account balances.",
    "A reimbursement is a Single income instance with income_kind reimbursement, not a separate object.",
    "A reviewed reimbursement Receipt income-statement item may support that Single income; subtotals and totals are not allocated again.",
    "Expense allocations from a reimbursement Single income must not count both parent expense and its items.",
    "The linked payroll transaction remains one booked cashflow movement.",
    "An Income statement is a Receipt with document_kind income-statement; it is not a separate object.",
    "An income-statement Receipt has a recorded issuer name; issuer is a field, not an Employer object.",
    "Each Single income item belongs to exactly one Single income and does not create a separate cashflow entry.",
    "Every Cashflow entry is expected or realized. Expected entries have a date, signed amount, currency, and reviewed commitment or contract basis; they need no Transaction or Receipt.",
    "A realized Cashflow entry references a posted Transaction. A Receipt may enrich either status but never establishes realization.",
    "An expected Cashflow entry retains its entry_id when realized; one posted Transaction maps to at most one entry per Cashflow sheet.",
    "Budget and Forecast relate to Cashflow entries, never directly to income or expense objects. Allocations must prevent double counting.",
    "Receipt items are source document lines on non-income-statement Receipts; Income statement items remain the distinct line type for income-statement Receipts.",
    "A Receipt item may map to zero or more Single expense items after review; their amounts are alternative descriptions of the same purchase and must not be added twice."
  ]
