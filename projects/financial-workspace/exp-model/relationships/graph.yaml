  "invariants": [
    "One cashflow entry per (sheet_id, transaction_id).",
    "Statement and transaction account IDs must agree.",
    "Every published entry references one evidenced booked transaction.",
    "No receipt match duplicates a posted movement.",
    "Unknown and unclassified transactions remain in the sheet.",
    "Refunds retain separate transaction identity.",
    "Each Balance item belongs to exactly one Account or Liability.",
    "Single income and Single expense may exist without transactions while planned; only matched posted transactions create cashflow entries.",
    "Budgets and forecasts never create cash movements or account balances.",
    "One event may link to multiple budgets or forecasts; aggregation requires explicit allocation to avoid double counting.",
    "A reimbursement link from an Income statement item requires a reviewed reimbursement component; a subtotal or statement total is not allocated again.",
    "Reimbursement links enrich the salary transaction; they do not create a second cashflow entry.",
    "A reimbursement line allocated to Single expense items is not also counted at their parent Single expense level."
