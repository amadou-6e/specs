schema_version: 2
object: "single-expense-item"
identity_field: "item_id"
primary_key:
  item_id:
    type: "string"
    required: true
    nullable: false
    description: "Persistent internal identity; not a display name."
foreign_keys:
  single_expense_id:
    type: "ref"
    required: true
    nullable: false
    target: "single-expense"
fields:
  description:
    type: "string"
    required: true
    nullable: false
  quantity:
    type: "decimal"
    required: true
    nullable: false
    encoding: "decimal-string"
    pattern: "^-?\\d+(\\.\\d+)?$"
  unit_amount:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
    pattern: "^-?\\d+(\\.\\d+)?$"
  line_amount:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
    pattern: "^-?\\d+(\\.\\d+)?$"
  currency:
    type: "string"
    required: false
    nullable: true
  category:
    type: "string"
    required: false
    nullable: true
  receipt_locator:
    type: "string"
    required: false
    nullable: true
constraints:
  - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
  - "Unknown optional values are null; no invented defaults."
  - "If unit_amount is supplied, currency must be supplied."
  - "If line_amount is supplied, currency must be supplied."
  - "New source-line matches use Receipt item relationships; receipt_locator is retained for legacy records."
validation_scope: "Typed specification contract; natural-language cross-record constraints require publication/reconciliation checks."
