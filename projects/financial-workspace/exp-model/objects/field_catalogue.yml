schema_version: 2
scope: all-financial-objects
authority: "*/schema.yaml"
description: "Semantic field descriptions and cross-object naming decisions. Types, keys and constraints are owned by each object schema.yaml."
normalization:
  rule: "Keep schema field names stable. Normalize synonymous meanings in this index; do not collapse fields with different roles."
  conditional_equivalence:
    - fields: [transaction.merchant, cashflow-entry.counterparty]
      condition: "Cashflow entry counterparty projects Transaction merchant when available; another counterparty need not be a merchant."
    - fields: [procurement.order_reference, receipt.order_reference]
      condition: "Equivalent only when the Receipt explicitly cites the same order."
  distinct_roles:
    - "An *_id string on its owner is identity; the same name as ref on another object is a relationship reference."
    - "Transaction amount is a signed movement; Balance item amount is a stock observation; Commitment term amount is an agreed charge; Income statement item amount is a statement line."
    - "Procurement total and Receipt total are separate source totals, even when equal."
    - "Receipt document_reference and order_reference identify different things unless the source explicitly uses one reference for both."
    - "booking_date, value_date, order_date, issue_date, due_date, as_of_date, effective_start and effective_end represent different events or intervals."
    - "representation_id identifies one source representation; representation_ids is a collection and is not a separate financial object."
objects:
  account:
    schema: "account/schema.yaml"
    primary_key:
      account_id: "Persistent internal identity; not a display name."
    foreign_keys:
      institution_id: "Reference to the Financial institution that provides this Account."
    fields:
      kind: "Account type: bank, wallet, card, or loan."
      ownership: "Recorded ownership classification of the account."
      native_reference: "Provider account reference, distinct from internal account_id."
      currencies: "Currencies supported by the Account."
      opened_on: "Date the Account was opened, if known."
      closed_on: "Date the Account was closed, if known."
  balance-item:
    schema: "balance-item/schema.yaml"
    primary_key:
      balance_item_id: "Stable identity of this dated Balance item."
    foreign_keys:
      account_id: "Reference to the Account whose balance is observed, when account-owned."
      representation_ids: "References to source representations supporting this Balance Item."
      supersedes_balance_item_id: "Reference to the earlier Balance item corrected by this observation."
      liability_id: "Reference to the Liability whose balance is observed, when liability-owned."
    fields:
      as_of_date: "Date at which this Balance item was observed."
      as_of_time: "Time at which this Balance item was observed, if available."
      timezone: "Timezone required to interpret a timestamped balance."
      amount: "Observed balance at the as-of date; a stock value, not cashflow."
      currency: "Currency of the observed balance."
      balance_type: "Type of balance observation, such as booked or outstanding debt."
      source_label: "Original label attached to the balance in its source."
      sign_convention: "Documented source sign convention; do not infer net-worth sign from raw sign alone."
  cashflow-entry:
    schema: "cashflow-entry/schema.yaml"
    primary_key:
      entry_id: "Stable identity of this Cashflow entry, independent of its display name."
    foreign_keys:
      sheet_id: "Cashflow sheet containing this entry."
      transaction_id: "Booked Transaction projected into this entry."
      account_id: "Account on which the Transaction was booked."
      institution_id: "Financial institution that provides the Account."
      procurement_ids: "Procurement records linked to this Transaction."
      recurring_expense_ids: "Recurring expenses linked through payment occurrences."
      recurring_income_ids: "Recurring income streams linked to this booked income row."
    fields:
      name: "Human-readable display title for the row."
      booking_date: "Date on which the source Transaction was booked."
      amount: "Signed amount of the booked Transaction in its original currency."
      currency: "Currency of the booked Transaction amount."
      counterparty: "Merchant or other counterparty named on the Transaction when available."
      reference: "Payment reference or purpose text carried by the Transaction."
      type: "Reviewed classification of the money movement."
      expense_category: "Reviewed expense grouping for filtered and aggregate cashflow views."
      purchase_category: "More specific purchase grouping when the expense is procurement."
      personal_work: "Reviewed personal versus work-related classification."
      order_dates: "Order dates supported by linked Procurement records."
      travel_dates: "Travel dates supported by linked Procurement details or receipts."
      service_periods: "Service periods of linked recurring Payment occurrences."
      item_descriptions: "Descriptions of linked Procurement items; these are row attributes, not separate cash movements."
      recurring_expense_names: "Display names of the linked recurring expenses."
      receipt_links: "Links to reviewed Receipt evidence, which may be email, PDF, image or another source form."
      income_statement_links: "Links to Income statement evidence supporting an income or reimbursement row."
      statement_links: "Links to Transaction statement evidence for the booked movement."
      evidence_status: "Completeness and reliability of source evidence for the row."
      match_status: "State of the reviewed linkage between the Transaction and supporting objects."
      reporting_treatment: "Instruction for cashflow aggregation and double-count prevention."
      run_id: "Workflow run that produced or last published the entry."
      model_version: "Version of the model used to produce the entry."
  cashflow-sheet:
    schema: "cashflow-sheet/schema.yaml"
    primary_key:
      sheet_id: "Persistent internal identity; not a display name."
    foreign_keys: {}
    fields:
      workspace_id: "Identifier of the containing Notion workspace."
      database_id: "Identifier of the Notion database."
      data_source_id: "Identifier of the Notion data source."
      schema_version: "Version identifier of the external sheet schema."
      view_configuration: "Configuration of views over the Cashflow sheet."
  commitment-term:
    schema: "commitment-term/schema.yaml"
    primary_key:
      term_id: "Persistent Commitment term identity."
    foreign_keys:
      recurring_expense_id: "Reference to the Recurring expense whose terms apply."
    fields:
      effective_start: "First date for which these terms or commitment apply."
      effective_end: "Last date for which these terms or commitment apply, if known."
      amount: "Agreed amount for the Commitment term, not a booked payment."
      currency: "Currency of the agreed term amount."
      cadence: "Frequency of the commitment or agreed payment."
  employer:
    schema: "employer/schema.yaml"
    primary_key:
      employer_id: "Persistent internal identity; not a display name."
    foreign_keys: {}
    fields:
      name: "Human-readable name for display."
      provider_references: "Provider-scoped references associated with this entity."
  financial-institution:
    schema: "financial-institution/schema.yaml"
    primary_key:
      institution_id: "Persistent internal identity; not a display name."
    foreign_keys: {}
    fields:
      name: "Human-readable name for display."
      provider_identifiers: "Identifiers assigned by the provider or registry."
  recurring-income:
    schema: "recurring-income/schema.yaml"
    primary_key:
      recurring_income_id: "Stable identity of an expected income stream."
    foreign_keys:
      employer_id: "Employer responsible for this income stream."
      representation_ids: "Source representations supporting the income basis."
    fields:
      description: "Name or description of the income stream."
      reviewed_basis: "Reviewed reason for treating the income as recurring."
      cadence: "Expected frequency of payment."
      effective_start: "First date the income stream applies."
      effective_end: "Last date the income stream applies, when known."
  income-statement:
    schema: "income-statement/schema.yaml"
    primary_key:
      income_statement_id: "Persistent internal identity; not a display name."
    foreign_keys:
      employer_id: "Reference to the Employer that issued this Income statement."
      recurring_income_id: "Optional recurring income stream documented by this statement."
      representation_ids: "References to source representations supporting this Income Statement."
    fields:
      period_start: "Beginning of the statement coverage period."
      period_end: "End of the statement coverage period."
      gross: "Gross amount reported by an Income statement."
      net: "Net amount reported by an Income statement."
      deductions: "Deduction amount reported by an Income statement."
      reimbursement: "Reimbursement amount reported by an Income statement."
      currency: "Currency of the statement totals."
  income-statement-item:
    schema: "income-statement-item/schema.yaml"
    primary_key:
      income_statement_item_id: "Persistent line identity; re-extraction must preserve reviewed identity."
    foreign_keys:
      income_statement_id: "Reference to the parent Income statement containing this line."
      representation_id: "Reference to the source representation containing this statement line."
    fields:
      label: "Original statement line label."
      line_kind: "Financial kind of an Income statement line."
      line_role: "Structural role of an Income statement line, distinguishing component from subtotal or total."
      amount: "Observed signed amount; preserve provider sign convention."
      currency: "Currency of this statement line amount."
      provider_code: "Code assigned to a statement line by its provider."
      section: "Source statement section containing this line."
      source_locator: "Page/row/field locator within a parent statement representation."
  liability:
    schema: "liability/schema.yaml"
    primary_key:
      liability_id: "Stable identity of this continuing Liability."
    foreign_keys:
      representation_ids: "References to source representations supporting this Liability."
    fields:
      creditor: "Party to whom the liability is owed."
      description: "Description of the continuing debt."
      kind: "Liability type: loan, credit-card debt, overdraft, other, or unknown."
      status: "Whether this Liability is active, settled, or of unknown status."
      native_reference: "Lender agreement or loan reference, distinct from liability_id."
      currency: "Currency of the original liability amount when known."
      original_amount: "Initial or contracted amount of the liability; not its outstanding balance."
      start_date: "Date on which the liability began, if evidenced."
      maturity_date: "Contractual maturity date, if evidenced."
  liability-term:
    schema: "liability-term/schema.yaml"
    primary_key:
      liability_term_id: "Stable identity of this version of Liability terms."
    foreign_keys:
      liability_id: "Reference to the Liability governed by these terms."
      representation_ids: "References to source representations supporting this Liability Term."
    fields:
      effective_start: "First date for which these terms or commitment apply."
      effective_end: "Last date for which these terms or commitment apply, if known."
      agreement_reference: "Provider reference for this version of a liability agreement."
      interest_rate: "Source-labelled rate; do not infer the rate basis or period."
      scheduled_repayment: "Repayment amount scheduled by the liability terms."
      repayment_currency: "Currency of the scheduled repayment."
      repayment_cadence: "Frequency of scheduled repayments."
  payment-occurrence:
    schema: "payment-occurrence/schema.yaml"
    primary_key:
      occurrence_id: "Persistent internal identity; not a display name."
    foreign_keys:
      recurring_expense_id: "Reference to the Recurring expense for this expected payment."
    fields:
      period: "Service period of the expected recurring payment."
      due_date: "Due date of one Payment occurrence."
      expected_amount: "Expected payment amount before settlement review."
      currency: "Currency of the expected payment amount."
      settlement_state: "State of settlement of a Payment occurrence."
  procurement:
    schema: "procurement/schema.yaml"
    primary_key:
      procurement_id: "Persistent internal identity; not a display name."
    foreign_keys:
      representation_ids: "References to source representations supporting this Procurement."
    fields:
      merchant: "Merchant named on a Procurement or Transaction."
      order_date: "Date on which the order was placed."
      order_reference: "Merchant order reference shared by Procurement and Receipt when evidenced."
      total: "Order total stated by the Procurement source; may differ from a settlement."
      currency: "Currency of the order total."
      travel_details: "Travel itinerary details evidenced by the Procurement source."
  procurement-item:
    schema: "procurement-item/schema.yaml"
    primary_key:
      item_id: "Persistent internal identity; not a display name."
    foreign_keys:
      procurement_id: "Reference to the Procurement containing this purchased item."
    fields:
      description: "Description of the purchased item."
      quantity: "Quantity of units on a Procurement item."
      unit_amount: "Price per unit of a Procurement item."
      line_amount: "Amount of a Procurement item line."
      currency: "Currency of the item amounts."
      category: "Classification of a Procurement item."
      receipt_locator: "Location of the corresponding item within a Receipt representation."
  receipt:
    schema: "receipt/schema.yaml"
    primary_key:
      receipt_id: "Persistent internal identity; not a display name."
    foreign_keys:
      representation_ids: "References to source representations supporting this Receipt."
    fields:
      document_kind: "Kind of document represented by a Receipt."
      issuer: "Issuer shown on a Receipt."
      document_reference: "Reference printed on the Receipt itself."
      order_reference: "Merchant order reference shared by Procurement and Receipt when evidenced."
      issue_date: "Date on which the Receipt document was issued."
      item_descriptions: "Descriptions of items listed on a Receipt without separate Receipt item objects."
      total: "Total printed on the Receipt document."
      currency: "Currency of the document total."
  recurring-expense:
    schema: "recurring-expense/schema.yaml"
    primary_key:
      recurring_expense_id: "Persistent internal identity; not a display name."
    foreign_keys:
      representation_ids: "References to source representations supporting this Recurring expense."
    fields:
      provider: "Provider named by the source record."
      description: "Description of the recurring agreement or service."
      reviewed_basis: "Reviewed evidence basis for a recurring expense."
      cadence: "Frequency of the commitment or agreed payment."
      effective_start: "First date for which these terms or commitment apply."
      effective_end: "Last date for which these terms or commitment apply, if known."
  transaction:
    schema: "transaction/schema.yaml"
    primary_key:
      transaction_id: "Persistent internal identity; not a display name."
    foreign_keys:
      account_id: "Reference to the Account on which this Transaction was booked."
      representation_ids: "References to source representations supporting this Transaction."
    fields:
      amount: "Signed amount of a booked account movement."
      currency: "Currency of the booked amount."
      booking_date: "Booking date recorded for this transaction."
      value_date: "Bank value date, distinct from booking date."
      merchant: "Merchant named on a Procurement or Transaction."
      reference: "Payment purpose or reference supplied with a Transaction."
      provider_transaction_id: "Transaction identifier assigned by the account provider; account-scoped."
      description: "Description shown for the booked movement."
  transaction-statement:
    schema: "transaction-statement/schema.yaml"
    primary_key:
      statement_id: "Persistent internal identity; not a display name."
    foreign_keys:
      account_id: "Reference to the Account covered by this Transaction statement."
      representation_ids: "References to source representations supporting this Transaction Statement."
    fields:
      coverage_start: "Start of the Transaction statement coverage interval."
      coverage_end: "End of the Transaction statement coverage interval."
      opening_balance: "Account balance at the start of the statement period."
      closing_balance: "Account balance at the end of the statement period."
      currency: "Currency of the statement balances."
      issued_on: "Date the Transaction statement was issued."
      revision: "Revision identifier of the Transaction statement."
