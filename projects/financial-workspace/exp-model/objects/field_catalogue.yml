schema_version: 1
scope: all-financial-objects
status: descriptive-index
authority: "*/schema.yaml"
cashflow_entry_source_schema: cashflow-entry/schema.yaml
cashflow_entry_source_mapping: ../mappings/cashflow/mapping.yaml
description: "Financial object field catalogue. Schemas remain authoritative; fields are attributes, not relationship-tree children."
groups:
  identity:
    - entry_id
    - sheet_id
    - transaction_id
    - name
  transaction_values:
    - booking_date
    - amount
    - currency
    - account_id
    - institution_id
    - counterparty
    - reference
  classification:
    - type
    - expense_category
    - purchase_category
    - personal_work
    - reporting_treatment
  purchase_and_travel:
    - order_dates
    - travel_dates
    - procurement_ids
    - item_descriptions
    - receipt_links
  recurring:
    - service_periods
    - commitment_ids
    - commitment_names
  income_and_statement_evidence:
    - income_statement_links
    - statement_links
  review_and_provenance:
    - evidence_status
    - match_status
    - run_id
    - model_version
fields:
  entry_id:
    type: "string"
    required: true
    nullable: false
    description: "Stable identity of this Cashflow entry, independent of its display name."
    source: "cashflow-entry.entry_id"
    derivation: "source-field"
    constraints:
      - "Must remain stable across replays of the same entry."
  sheet_id:
    type: "ref"
    required: true
    nullable: false
    description: "Cashflow sheet containing this entry."
    source: "cashflow-sheet.sheet_id"
    derivation: "source-field"
    target: "cashflow-sheet"
    constraints:
      - "Together with transaction_id, uniquely identifies a canonical sheet row."
  transaction_id:
    type: "ref"
    required: true
    nullable: false
    description: "Booked Transaction projected into this entry."
    source: "transaction.transaction_id"
    derivation: "source-field"
    target: "transaction"
    constraints:
      - "Exactly one evidenced booked Transaction per accepted entry."
      - "Together with sheet_id, must be unique."
  name:
    type: "string"
    required: false
    nullable: true
    description: "Human-readable display title for the row."
    source: "transaction.description"
    derivation: "source-field"
  booking_date:
    type: "date"
    required: true
    nullable: false
    description: "Date on which the source Transaction was booked."
    source: "transaction.booking_date"
    derivation: "source-field"
    format: "YYYY-MM-DD"
    constraints:
      - "Must equal the referenced Transaction booking_date; do not substitute order or travel date."
  amount:
    type: "decimal"
    required: true
    nullable: false
    description: "Signed amount of the booked Transaction in its original currency."
    source: "transaction.amount"
    derivation: "source-field"
    encoding: "decimal-string"
    constraints:
      - "Must equal the referenced Transaction amount, including sign."
      - "Do not sum item descriptions as additional movements."
  currency:
    type: "string"
    required: true
    nullable: false
    description: "Currency of the booked Transaction amount."
    source: "transaction.currency"
    derivation: "source-field"
    constraints:
      - "Must equal the referenced Transaction currency."
      - "Aggregate monetary values by currency."
  account_id:
    type: "ref"
    required: true
    nullable: false
    description: "Account on which the Transaction was booked."
    source: "transaction.account_id"
    derivation: "source-field"
    target: "account"
    constraints:
      - "Must equal the referenced Transaction account_id."
  institution_id:
    type: "ref"
    required: true
    nullable: false
    description: "Financial institution that provides the Account."
    source: "account.institution_id"
    derivation: "source-field"
    target: "financial-institution"
    constraints:
      - "Must agree with the referenced Account's institution."
  counterparty:
    type: "string"
    required: false
    nullable: true
    description: "Merchant or other counterparty named on the Transaction when available."
    source: "transaction.merchant"
    derivation: "source-field"
  reference:
    type: "string"
    required: false
    nullable: true
    description: "Payment reference or purpose text carried by the Transaction."
    source: "transaction.reference"
    derivation: "source-field"
  type:
    type: "string"
    required: true
    nullable: false
    description: "Reviewed classification of the money movement."
    source: null
    derivation: "reviewed-classification"
    allowed_values: ["income", "expense", "refund", "transfer", "other", "unknown"]
    constraints:
      - "Use unknown when classification is unresolved; do not invent certainty."
  expense_category:
    type: "string"
    required: true
    nullable: false
    description: "Reviewed expense grouping for filtered and aggregate cashflow views."
    source: null
    derivation: "reviewed-classification"
    allowed_values: ["procurement", "recurring-expense", "other", "unclassified", "mixed"]
    constraints:
      - "Use unclassified when the expense grouping is unresolved."
      - "The existing enum is the current schema boundary; do not infer finer categories from this catalogue."
  purchase_category:
    type: "string"
    required: false
    nullable: true
    description: "More specific purchase grouping when the expense is procurement."
    source: null
    derivation: "run-context"
    constraints:
      - "Leave null when no reviewed procurement grouping applies."
  personal_work:
    type: "string"
    required: true
    nullable: false
    description: "Reviewed personal versus work-related classification."
    source: null
    derivation: "reviewed-classification"
    allowed_values: ["personal", "work", "mixed", "unknown"]
    constraints:
      - "Use unknown when evidence does not establish personal versus work use."
  order_dates:
    type: "date[]"
    required: false
    nullable: true
    description: "Order dates supported by linked Procurement records."
    source: "procurement.order_date"
    derivation: "source-field"
    constraints:
      - "Retain distinct evidenced dates; never substitute booking_date."
  travel_dates:
    type: "date[]"
    required: false
    nullable: true
    description: "Travel dates supported by linked Procurement details or receipts."
    source: "procurement.travel_details"
    derivation: "source-field"
    constraints:
      - "Retain distinct evidenced travel dates; never infer them from purchase date."
  service_periods:
    type: "string[]"
    required: false
    nullable: true
    description: "Service periods of linked recurring Payment occurrences."
    source: "payment-occurrence.period"
    derivation: "source-field"
    constraints:
      - "Use only periods supported by linked Payment occurrences."
  procurement_ids:
    type: "ref[]"
    required: false
    nullable: true
    description: "Procurement records linked to this Transaction."
    source: "procurement.procurement_id"
    derivation: "source-field"
    target: "procurement"
    constraints:
      - "Links must be reviewed; an amount/date candidate alone is insufficient."
  item_descriptions:
    type: "string[]"
    required: false
    nullable: true
    description: "Descriptions of linked Procurement items; these are row attributes, not separate cash movements."
    source: "procurement-item.description"
    derivation: "source-field"
    constraints:
      - "Descriptions do not create extra Cashflow entries."
  commitment_ids:
    type: "ref[]"
    required: false
    nullable: true
    description: "Recurring commitments linked through the payment occurrence."
    source: "recurring-commitment.commitment_id"
    derivation: "source-field"
    target: "recurring-commitment"
    constraints:
      - "Links must be reviewed and may remain absent."
  commitment_names:
    type: "string[]"
    required: false
    nullable: true
    description: "Display names of the linked recurring commitments."
    source: "recurring-commitment.description"
    derivation: "source-field"
  receipt_links:
    type: "string[]"
    required: false
    nullable: true
    description: "Links to reviewed Receipt evidence, which may be email, PDF, image or another source form."
    source: null
    derivation: "provenance-links"
    constraints:
      - "Receipt evidence enriches the row; it does not create another movement."
  income_statement_links:
    type: "string[]"
    required: false
    nullable: true
    description: "Links to Income statement evidence supporting an income or reimbursement row."
    source: null
    derivation: "provenance-links"
    constraints:
      - "An Income statement supports the row but is not the booked Transaction."
  statement_links:
    type: "string[]"
    required: false
    nullable: true
    description: "Links to Transaction statement evidence for the booked movement."
    source: null
    derivation: "provenance-links"
    constraints:
      - "Link to the statement containing the booked Transaction when available."
  evidence_status:
    type: "string"
    required: true
    nullable: false
    description: "Completeness and reliability of source evidence for the row."
    source: null
    derivation: "reviewed-classification"
    allowed_values: ["missing", "partial", "verified", "ambiguous"]
    constraints:
      - "Describes source evidence, distinct from match_status."
  match_status:
    type: "string"
    required: true
    nullable: false
    description: "State of the reviewed linkage between the Transaction and supporting objects."
    source: null
    derivation: "reviewed-classification"
    allowed_values: ["missing", "partial", "verified", "ambiguous"]
    constraints:
      - "Describes linkage confidence, distinct from evidence_status."
  reporting_treatment:
    type: "string"
    required: true
    nullable: false
    description: "Instruction for cashflow aggregation and double-count prevention."
    source: null
    derivation: "reviewed-classification"
    allowed_values: ["include", "internal-transfer", "wallet-funding", "liability-movement", "unresolved"]
    constraints:
      - "Only include is counted as ordinary external cashflow; other values need explicit reporting handling."
      - "Do not double count internal transfers or wallet funding."
  run_id:
    type: "string"
    required: true
    nullable: false
    description: "Workflow run that produced or last published the entry."
    source: null
    derivation: "run-context"
    constraints:
      - "Required for publication audit."
  model_version:
    type: "string"
    required: true
    nullable: false
    description: "Version of the model used to produce the entry."
    source: null
    derivation: "run-context"
    constraints:
      - "Required to reproduce the published projection."
cross_field_constraints:
  - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
  - "Unknown optional values are null; no invented defaults."
  - "Unique(sheet_id, transaction_id)."
  - "amount, currency, booking_date and account_id equal the referenced transaction."
  - "Aggregate by currency and reporting treatment; do not duplicate payment totals across item categories."
normalization:
  rule: "Keep schema field names stable. Normalize synonymous meanings in this index; do not collapse fields with different roles."
  conditional_equivalence:
    - fields: [transaction.merchant, cashflow-entry.counterparty]
      condition: "Cashflow entry counterparty projects Transaction merchant when available; another counterparty need not be a merchant."
    - fields: [procurement.order_reference, receipt.order_reference]
      condition: "Equivalent only when the Receipt explicitly cites the same order."
  distinct_roles:
    - "An *_id string on its owner is identity; the same name as ref on another object is a relationship reference."
    - "Transaction amount is a signed movement; Balance item amount is a stock observation; Commitment term amount is an agreed charge; Income statement item amount is a statement line."
    - "Procurement total and Receipt total are separate source totals, even when equal."
    - "Receipt document_reference and order_reference identify different things unless the source explicitly uses one reference for both."
    - "booking_date, value_date, order_date, issue_date, due_date, as_of_date, effective_start and effective_end represent different events or intervals."
    - "representation_id identifies one source representation; representation_ids is a collection and is not a separate financial object."
object_fields:
  account:
    source_schema: account/schema.yaml
    fields:
      account_id:
        type: "string"
        required: true
        nullable: false
        description: "Persistent internal identity; not a display name."
      institution_id:
        type: "ref"
        required: true
        nullable: false
        description: "Reference to the Financial institution that provides this Account."
        target: "financial-institution"
      kind:
        type: "string"
        required: true
        nullable: false
        description: "Account type: bank, wallet, card, or loan."
        allowed_values: ["bank", "wallet", "card", "loan"]
      ownership:
        type: "string"
        required: true
        nullable: false
        description: "Recorded ownership classification of the account."
      native_reference:
        type: "string"
        required: false
        nullable: true
        description: "Provider account reference, distinct from internal account_id."
      currencies:
        type: "string[]"
        required: false
        nullable: true
        description: "Currencies supported by the Account."
        min_items: 0
      opened_on:
        type: "date"
        required: false
        nullable: true
        description: "Date the Account was opened, if known."
        format: "YYYY-MM-DD"
      closed_on:
        type: "date"
        required: false
        nullable: true
        description: "Date the Account was closed, if known."
        format: "YYYY-MM-DD"
    object_constraints:
      - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
      - "Unknown optional values are null; no invented defaults."
      - "Currency policy may permit multiple currencies; source amount currency is retained."
  balance-item:
    source_schema: balance-item/schema.yaml
    fields:
      balance_item_id:
        type: "string"
        required: true
        nullable: false
        description: "Stable identity of this dated Balance item."
      account_id:
        type: "ref"
        required: false
        nullable: true
        description: "Reference to the Account whose balance is observed, when account-owned."
        target: "account"
      as_of_date:
        type: "date"
        required: true
        nullable: false
        description: "Date at which this Balance item was observed."
        format: "YYYY-MM-DD"
      as_of_time:
        type: "string"
        required: false
        nullable: true
        description: "Time at which this Balance item was observed, if available."
      timezone:
        type: "string"
        required: false
        nullable: true
        description: "Timezone required to interpret a timestamped balance."
      amount:
        type: "decimal"
        required: true
        nullable: false
        description: "Observed balance at the as-of date; a stock value, not cashflow."
        encoding: "decimal-string"
        pattern: "^-?\\d+(\\.\\d+)?$"
      currency:
        type: "string"
        required: true
        nullable: false
        description: "Currency of the observed balance."
      balance_type:
        type: "string"
        required: true
        nullable: false
        description: "Type of balance observation, such as booked or outstanding debt."
        allowed_values: ["booked", "available", "outstanding-debt", "other", "unknown"]
      source_label:
        type: "string"
        required: false
        nullable: true
        description: "Original label attached to the balance in its source."
      sign_convention:
        type: "string"
        required: true
        nullable: false
        description: "Documented source sign convention; do not infer net-worth sign from raw sign alone."
      representation_ids:
        type: "ref[]"
        required: true
        nullable: false
        description: "References to source representations supporting this Balance Item."
        target: "source-representation"
        min_items: 1
      supersedes_balance_item_id:
        type: "ref"
        required: false
        nullable: true
        description: "Reference to the earlier Balance item corrected by this observation."
        target: "balance-item"
      liability_id:
        type: "ref"
        required: false
        nullable: true
        description: "Reference to the Liability whose balance is observed, when liability-owned."
        target: "liability"
    object_constraints:
      - "Exactly one of account_id or liability_id owns each Balance item."
      - "As-of date is distinct from evidence retrieval time."
      - "Timestamp precision requires timezone; a date alone does not imply end-of-day."
      - "Different currencies, balance types or cutoffs are not interchangeable."
      - "A balance is a stock observation, not an additive cashflow or transaction."
      - "Corrections preserve previous observations and evidence; repeated source captures do not duplicate the financial observation."
      - "Where linked to a Transaction statement, the Balance item is account-owned and the Account must agree."
  cashflow-sheet:
    source_schema: cashflow-sheet/schema.yaml
    fields:
      sheet_id:
        type: "string"
        required: true
        nullable: false
        description: "Persistent internal identity; not a display name."
      workspace_id:
        type: "string"
        required: true
        nullable: false
        description: "Identifier of the containing Notion workspace."
      database_id:
        type: "string"
        required: true
        nullable: false
        description: "Identifier of the Notion database."
      data_source_id:
        type: "string"
        required: true
        nullable: false
        description: "Identifier of the Notion data source."
      schema_version:
        type: "string"
        required: true
        nullable: false
        description: "Version identifier of the external sheet schema."
      view_configuration:
        type: "object"
        required: false
        nullable: true
        description: "Configuration of views over the Cashflow sheet."
    object_constraints:
      - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
      - "Unknown optional values are null; no invented defaults."
  commitment-term:
    source_schema: commitment-term/schema.yaml
    fields:
      term_id:
        type: "string"
        required: true
        nullable: false
        description: "Persistent Commitment term identity."
      commitment_id:
        type: "ref"
        required: true
        nullable: false
        description: "Reference to the Recurring commitment whose terms apply."
        target: "recurring-commitment"
      effective_start:
        type: "date"
        required: true
        nullable: false
        description: "First date for which these terms or commitment apply."
        format: "YYYY-MM-DD"
      effective_end:
        type: "date"
        required: false
        nullable: true
        description: "Last date for which these terms or commitment apply, if known."
        format: "YYYY-MM-DD"
      amount:
        type: "decimal"
        required: true
        nullable: false
        description: "Agreed amount for the Commitment term, not a booked payment."
        encoding: "decimal-string"
        pattern: "^-?\\d+(\\.\\d+)?$"
      currency:
        type: "string"
        required: true
        nullable: false
        description: "Currency of the agreed term amount."
      cadence:
        type: "string"
        required: true
        nullable: false
        description: "Frequency of the commitment or agreed payment."
    object_constraints:
      - "Each Commitment term belongs to exactly one Recurring commitment."
      - "An commitment may have no Commitment term records."
      - "effective_end, when supplied, must not precede effective_start."
      - "Preserve evidence and reviewed corrections; do not invent terms for incomplete commitments."
  employer:
    source_schema: employer/schema.yaml
    fields:
      employer_id:
        type: "string"
        required: true
        nullable: false
        description: "Persistent internal identity; not a display name."
      name:
        type: "string"
        required: true
        nullable: false
        description: "Human-readable name for display."
      provider_references:
        type: "string[]"
        required: false
        nullable: true
        description: "Provider-scoped references associated with this entity."
        min_items: 0
    object_constraints:
      - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
      - "Unknown optional values are null; no invented defaults."
  financial-institution:
    source_schema: financial-institution/schema.yaml
    fields:
      institution_id:
        type: "string"
        required: true
        nullable: false
        description: "Persistent internal identity; not a display name."
      name:
        type: "string"
        required: true
        nullable: false
        description: "Human-readable name for display."
      provider_identifiers:
        type: "string[]"
        required: false
        nullable: true
        description: "Identifiers assigned by the provider or registry."
        min_items: 0
    object_constraints:
      - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
      - "Unknown optional values are null; no invented defaults."
  income-statement:
    source_schema: income-statement/schema.yaml
    fields:
      income_statement_id:
        type: "string"
        required: true
        nullable: false
        description: "Persistent internal identity; not a display name."
      employer_id:
        type: "ref"
        required: true
        nullable: false
        description: "Reference to the Employer that issued this Income statement."
        target: "employer"
      period_start:
        type: "date"
        required: true
        nullable: false
        description: "Beginning of the statement coverage period."
        format: "YYYY-MM-DD"
      period_end:
        type: "date"
        required: true
        nullable: false
        description: "End of the statement coverage period."
        format: "YYYY-MM-DD"
      representation_ids:
        type: "ref[]"
        required: true
        nullable: false
        description: "References to source representations supporting this Income Statement."
        target: "source-representation"
        min_items: 1
      gross:
        type: "decimal"
        required: false
        nullable: true
        description: "Gross amount reported by an Income statement."
        encoding: "decimal-string"
        pattern: "^-?\\d+(\\.\\d+)?$"
      net:
        type: "decimal"
        required: false
        nullable: true
        description: "Net amount reported by an Income statement."
        encoding: "decimal-string"
        pattern: "^-?\\d+(\\.\\d+)?$"
      deductions:
        type: "decimal"
        required: false
        nullable: true
        description: "Deduction amount reported by an Income statement."
        encoding: "decimal-string"
        pattern: "^-?\\d+(\\.\\d+)?$"
      reimbursement:
        type: "decimal"
        required: false
        nullable: true
        description: "Reimbursement amount reported by an Income statement."
        encoding: "decimal-string"
        pattern: "^-?\\d+(\\.\\d+)?$"
      currency:
        type: "string"
        required: false
        nullable: true
        description: "Currency of the statement totals."
    object_constraints:
      - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
      - "Unknown optional values are null; no invented defaults."
      - "If gross is supplied, currency must be supplied."
      - "If net is supplied, currency must be supplied."
      - "If deductions is supplied, currency must be supplied."
      - "If reimbursement is supplied, currency must be supplied."
      - "Gross, net, deductions and reimbursement retain observed summary values; Income statement items retain source lines."
      - "Do not count statement summaries and their item components as additional cashflow; reconcile discrepancies explicitly."
  income-statement-item:
    source_schema: income-statement-item/schema.yaml
    fields:
      income_statement_item_id:
        type: "string"
        required: true
        nullable: false
        description: "Persistent line identity; re-extraction must preserve reviewed identity."
      income_statement_id:
        type: "ref"
        required: true
        nullable: false
        description: "Reference to the parent Income statement containing this line."
        target: "income-statement"
      label:
        type: "string"
        required: true
        nullable: false
        description: "Original statement line label."
      line_kind:
        type: "string"
        required: true
        nullable: false
        description: "Financial kind of an Income statement line."
        allowed_values: ["earnings", "deduction", "reimbursement", "other", "unclassified"]
      line_role:
        type: "string"
        required: true
        nullable: false
        description: "Structural role of an Income statement line, distinguishing component from subtotal or total."
        allowed_values: ["component", "subtotal", "total", "informational", "unclassified"]
      amount:
        type: "decimal"
        required: false
        nullable: true
        description: "Observed signed amount; preserve provider sign convention."
        encoding: "decimal-string"
        pattern: "^-?\\d+(\\.\\d+)?$"
      currency:
        type: "string"
        required: false
        nullable: true
        description: "Currency of this statement line amount."
      provider_code:
        type: "string"
        required: false
        nullable: true
        description: "Code assigned to a statement line by its provider."
      section:
        type: "string"
        required: false
        nullable: true
        description: "Source statement section containing this line."
      source_locator:
        type: "string"
        required: true
        nullable: false
        description: "Page/row/field locator within a parent statement representation."
      representation_id:
        type: "ref"
        required: true
        nullable: false
        description: "Reference to the source representation containing this statement line."
        target: "source-representation"
    object_constraints:
      - "Each item belongs to exactly one Income statement."
      - "Income statements may have zero extracted items when breakdown is unavailable."
      - "If amount is supplied, currency must be supplied."
      - "The referenced representation must support the parent Income statement."
      - "Do not sum components, subtotals and totals together; reconcile using the observed section structure."
      - "Unknown amounts remain null, not zero."
      - "Statement items do not create cashflow entries; only booked transactions do."
  liability:
    source_schema: liability/schema.yaml
    fields:
      liability_id:
        type: "string"
        required: true
        nullable: false
        description: "Stable identity of this continuing Liability."
      creditor:
        type: "string"
        required: true
        nullable: false
        description: "Party to whom the liability is owed."
      description:
        type: "string"
        required: true
        nullable: false
        description: "Description of the continuing debt."
      kind:
        type: "string"
        required: true
        nullable: false
        description: "Liability type: loan, credit-card debt, overdraft, other, or unknown."
        allowed_values: ["loan", "credit-card-debt", "overdraft", "other", "unknown"]
      status:
        type: "string"
        required: true
        nullable: false
        description: "Whether this Liability is active, settled, or of unknown status."
        allowed_values: ["active", "settled", "unknown"]
      native_reference:
        type: "string"
        required: false
        nullable: true
        description: "Lender agreement or loan reference, distinct from liability_id."
      currency:
        type: "string"
