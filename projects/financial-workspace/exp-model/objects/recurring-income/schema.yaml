schema_version: 2
object: "recurring-income"
identity_field: "recurring_income_id"
primary_key:
  recurring_income_id:
    type: "string"
    required: true
    nullable: false
foreign_keys:
  representation_ids:
    type: "ref[]"
    required: false
    nullable: true
    target: "source-representation"
fields:
  payer_name:
    type: "string"
    required: false
    nullable: true
    description: "Payer or employer shown in supporting documents; not a separate model object."
  description:
    type: "string"
    required: true
    nullable: false
  reviewed_basis:
    type: "string"
    required: false
    nullable: true
  cadence:
    type: "string"
    required: false
    nullable: true
  effective_start:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
  effective_end:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
constraints:
  - "Payer identity is retained as a source-backed field when known."
  - "At least one source representation or reviewed basis is required."
  - "The end date must not precede the start date when both are known."
  - "Expected income is not a booked cash movement."
validation_scope: "Typed specification contract; cross-record consistency requires publication checks."
