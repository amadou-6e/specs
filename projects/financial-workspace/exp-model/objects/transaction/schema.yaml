schema_version: 2
object: "transaction"
identity_field: "transaction_id"
primary_key:
  transaction_id:
    type: "string"
    required: true
    nullable: false
    description: "Persistent internal identity; not a display name."
foreign_keys:
  account_id:
    type: "ref"
    required: true
    nullable: false
    target: "account"
  representation_ids:
    type: "ref[]"
    required: true
    nullable: false
    min_items: 1
    target: "source-representation"
fields:
  amount:
    type: "decimal"
    required: true
    nullable: false
    encoding: "decimal-string"
    pattern: "^-?\\d+(\\.\\d+)?$"
  currency:
    type: "string"
    required: true
    nullable: false
  booking_date:
    type: "date"
    required: true
    nullable: false
    format: "YYYY-MM-DD"
  value_date:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
  merchant:
    type: "string"
    required: false
    nullable: true
  reference:
    type: "string"
    required: false
    nullable: true
  provider_transaction_id:
    type: "string"
    required: false
    nullable: true
  description:
    type: "string"
    required: false
    nullable: true
constraints:
  - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
  - "Unknown optional values are null; no invented defaults."
  - "amount is signed; booked account movements only."
  - "Provider ID is account-scoped; amount/date/merchant alone are not a unique key."
validation_scope: "Typed specification contract; natural-language cross-record constraints require publication/reconciliation checks."
