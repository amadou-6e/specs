schema_version: 2
object: "recurring-commitment"
identity_field: "commitment_id"
primary_key:
  commitment_id:
    type: "string"
    required: true
    nullable: false
    description: "Persistent internal identity; not a display name."
foreign_keys:
  representation_ids:
    type: "ref[]"
    required: false
    nullable: true
    min_items: 0
    target: "source-representation"
fields:
  provider:
    type: "string"
    required: true
    nullable: false
  description:
    type: "string"
    required: true
    nullable: false
  reviewed_basis:
    type: "string"
    required: false
    nullable: true
  cadence:
    type: "string"
    required: false
    nullable: true
  effective_start:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
  effective_end:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
constraints:
  - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
  - "Unknown optional values are null; no invented defaults."
  - "At least one source representation or nonempty reviewed_basis is required."
  - "Optional Commitment term records are linked through commitment-terms; no embedded terms copy."
validation_scope: "Typed specification contract; natural-language cross-record constraints require publication/reconciliation checks."
