schema_version: 2
object: "receipt"
identity_field: "receipt_id"
primary_key:
  receipt_id:
    type: "string"
    required: true
    nullable: false
    description: "Persistent internal identity; not a display name."
foreign_keys:
  representation_ids:
    type: "ref[]"
    required: true
    nullable: false
    min_items: 1
    target: "source-representation"
  recurring_income_id:
    type: "ref"
    required: false
    nullable: true
    target: "recurring-income"
fields:
  document_kind:
    type: "string"
    required: true
    nullable: false
    enum:
      - "order-confirmation"
      - "invoice"
      - "paid-receipt"
      - "refund-confirmation"
      - "booking-confirmation"
      - "income-statement"
  period_start:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
  period_end:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
  gross:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
  net:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
  deductions:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
  reimbursement:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
  issuer:
    type: "string"
    required: false
    nullable: true
  document_reference:
    type: "string"
    required: false
    nullable: true
  order_reference:
    type: "string"
    required: false
    nullable: true
  issue_date:
    type: "date"
    required: false
    nullable: true
    format: "YYYY-MM-DD"
  item_descriptions:
    type: "string[]"
    required: false
    nullable: true
    min_items: 0
  total:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
    pattern: "^-?\\d+(\\.\\d+)?$"
  currency:
    type: "string"
    required: false
    nullable: true
constraints:
  - "An Income statement is a Receipt with document_kind income-statement."
  - "For an income-statement Receipt, issuer, period_start and period_end are required."
  - "Payroll summary fields and recurring_income_id are only populated for an income-statement Receipt."
  - "If gross, net, deductions or reimbursement is supplied, currency is required."
  - "If recurring_income_id is set, its payer_name should agree with the Receipt issuer when both are evidenced; differences require review."
  - "Preserve observed statement summaries separately from detailed Income statement items."
  - "Required fields apply to accepted canonical records; incomplete extractions remain candidates."
  - "Unknown optional values are null; no invented defaults."
  - "If total is supplied, currency must be supplied."
  - "Document kind or format alone does not establish a booked payment."
validation_scope: "Typed specification contract; natural-language cross-record constraints require publication/reconciliation checks."
