schema_version: 2
object: "income-statement-item"
identity_field: "income_statement_item_id"
primary_key:
  income_statement_item_id:
    type: "string"
    required: true
    nullable: false
    description: "Persistent line identity; re-extraction must preserve reviewed identity."
foreign_keys:
  receipt_id:
    type: "ref"
    required: true
    nullable: false
    target: "receipt"
  representation_id:
    type: "ref"
    required: true
    nullable: false
    target: "source-representation"
fields:
  label:
    type: "string"
    required: true
    nullable: false
    description: "Original statement line label."
  line_kind:
    type: "string"
    required: true
    nullable: false
    enum:
      - "earnings"
      - "deduction"
      - "reimbursement"
      - "other"
      - "unclassified"
  line_role:
    type: "string"
    required: true
    nullable: false
    enum:
      - "component"
      - "subtotal"
      - "total"
      - "informational"
      - "unclassified"
  amount:
    type: "decimal"
    required: false
    nullable: true
    encoding: "decimal-string"
    pattern: "^-?\\d+(\\.\\d+)?$"
    description: "Observed signed amount; preserve provider sign convention."
  currency:
    type: "string"
    required: false
    nullable: true
  provider_code:
    type: "string"
    required: false
    nullable: true
  section:
    type: "string"
    required: false
    nullable: true
  source_locator:
    type: "string"
    required: true
    nullable: false
    description: "Page/row/field locator within a parent statement representation."
constraints:
  - "Each item belongs to exactly one income-statement Receipt."
  - "Income-statement Receipts may have zero extracted items when breakdown is unavailable."
  - "The parent Receipt must have document_kind income-statement."
  - "If amount is supplied, currency must be supplied."
  - "The referenced representation must support the parent Receipt."
  - "Do not sum components, subtotals and totals together; reconcile using the observed section structure."
  - "Unknown amounts remain null, not zero."
  - "Statement items do not create cashflow entries; only booked transactions do."
  - "Only a reviewed reimbursement component may support a reimbursement-kind Single income; subtotals and totals are not allocated again."
validation_scope: "Typed specification contract; section reconciliation and evidence require review."
