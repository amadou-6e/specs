openapi: "3.1.0"
info:
  title: BlogHub — Connections API
  description: |
    Manages credentials for blog publishing platforms and AI providers.

    **Service group:** `connections`
    **Router prefix:** `/api/connections`
    **Store:** `backend/store/memory.py → _connections` dict.
    Connections survive `POST /api/dev/reset` — they hold user secrets, not article state.

    ### Supported connections

    | ID          | Type | Auth method                                        |
    |-------------|------|----------------------------------------------------|
    | `medium`    | blog | OAuth 2.0 popup **or** Integration Token           |
    | `hashnode`  | blog | Personal Access Token                              |
    | `devto`     | blog | API Key                                            |
    | `anthropic` | ai   | CLI browser login (loopback OAuth) **or** API Key  |
    | `openai`    | ai   | CLI browser login (device code) **or** API Key     |

    ### Medium OAuth popup flow

    1. Frontend calls `GET /api/connections/medium/oauth-start`.
    2. If `MEDIUM_CLIENT_ID` is set, a popup is opened to the returned `url`.
    3. Medium redirects to `GET /api/connections/medium/oauth-callback?code=…`.
    4. Backend exchanges the code for an access token (requires `MEDIUM_CLIENT_SECRET`),
       fetches `/v1/me` for the username, stores the token, and responds with a tiny HTML page
       that calls `window.opener.postMessage(...)` and closes itself.
    5. The opener page receives the `oauth-complete` message and refreshes the connections list.

    ### AI provider CLI browser login

    Both Anthropic and OpenAI use `GET /api/connections/{conn_id}/oauth-start`, which delegates to
    the CLI runner service (port 8001).

    **Anthropic — loopback OAuth (`flow: "cli_browser"`)**

    1. Runner spawns `claude auth login`, which starts an HTTP server on a random port.
    2. Backend returns `{ flow: "cli_browser", url: "https://claude.ai/oauth/authorize?…" }`.
    3. Frontend opens the URL. User authorises on claude.ai.
    4. Browser tries to redirect to `http://localhost:{PORT}/callback?code=…` — fails (Docker port
       unreachable from host). Page shows a connection error.
    5. User copies the full address-bar URL and submits it via `POST /api/connections/anthropic/submit-code`.
    6. Backend forwards to runner, which replays the GET to the CLI's internal server.
    7. CLI completes the token exchange and saves credentials to its config volume.
    8. Frontend polls `GET /api/connections/anthropic/cli-login-status` every 2 s until connected.

    **OpenAI — device code (RFC 8628) (`flow: "device_code"`)**

    1. Runner spawns `codex login --device-auth`.
    2. Backend returns `{ flow: "device_code", url: "https://auth.openai.com/codex/device",
       device_code: "XXXX-XXXXX" }`.
    3. Frontend opens the URL in a new tab and displays the device code prominently.
    4. User logs into ChatGPT on that page and enters the device code shown in the UI.
    5. No submit step needed — the CLI polls OpenAI's token endpoint internally.
    6. Frontend polls `GET /api/connections/openai/cli-login-status` every 2 s until connected.
  version: "0.1.0"

servers:
  - url: http://localhost:8000
    description: Local dev (uvicorn)

tags:
  - name: connections
    description: Credential management for platforms and AI providers.
  - name: connections-oauth
    description: Browser login flows — Medium OAuth 2.0 popup and AI provider CLI login.

paths:

  /api/connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List all connections
      description: Returns all 5 known connections (blog + AI) with their current status.
      responses:
        "200":
          description: Connection list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionListResponse" }
              example:
                connections:
                  - id: medium
                    label: "Medium"
                    type: blog
                    authMethod: oauth_or_token
                    status: connected
                    username: "@acisse"
                    connectedAt: "2026-04-03T09:00:00Z"
                    errorMessage: null
                  - id: anthropic
                    label: "Claude (Anthropic)"
                    type: ai
                    authMethod: token
                    status: disconnected
                    username: null
                    connectedAt: null
                    errorMessage: null

  /api/connections/{conn_id}:

    put:
      operationId: saveToken
      tags: [connections]
      summary: Save API token
      description: |
        Stores the token and marks the connection as `connected`.
        Works for all 5 connection IDs.
        For Medium, use this when you have an Integration Token;
        for the OAuth flow, use the dedicated `/oauth-start` endpoint instead.
      parameters:
        - name: conn_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ConnectionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTokenRequest" }
            example: { token: "hshpat_abc123…" }
      responses:
        "200":
          description: Token saved; connection marked connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveTokenResponse" }
              example: { id: hashnode, status: connected, username: null, errorMessage: null }
        "404":
          description: Unknown connection ID.
        "422":
          description: Validation error (token empty).

    delete:
      operationId: disconnectConnection
      tags: [connections]
      summary: Disconnect
      description: Removes the stored token and marks the connection as `disconnected`.
      parameters:
        - name: conn_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ConnectionId" }
      responses:
        "200":
          description: Disconnected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: disconnected }
        "404":
          description: Unknown connection ID.

  /api/connections/{conn_id}/test:
    post:
      operationId: testConnection
      tags: [connections]
      summary: Test a saved connection
      description: |
        Verifies the stored credential is still valid by making a lightweight
        authenticated request to the platform or AI provider.
        Returns the new status — `connected` if the credential works, `error` if not.
        Triggered by the **Test** button on a settings card (ST-13, ST-24).
      parameters:
        - name: conn_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ConnectionId" }
      responses:
        "200":
          description: Test complete.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [connected, error] }
                  errorMessage: { type: string, nullable: true }
              examples:
                ok:
                  value: { status: connected, errorMessage: null }
                fail:
                  value: { status: error, errorMessage: "Auth token expired" }
        "404":
          description: Unknown connection ID.
        "422":
          description: No credential stored — nothing to test.

  /api/connections/medium/oauth-start:
    get:
      operationId: oauthStart
      tags: [connections-oauth]
      summary: Get Medium OAuth URL
      description: |
        Returns the Medium authorization URL to open in a popup window.
        When `MEDIUM_CLIENT_ID` is not configured, returns `available: false`
        so the frontend can disable the OAuth button and prompt for a token instead.
      responses:
        "200":
          description: OAuth start info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthStartResponse" }
              examples:
                configured:
                  value:
                    available: true
                    url: "https://medium.com/m/oauth/authorize?client_id=…"
                not_configured:
                  value:
                    available: false
                    url: null

  /api/connections/medium/oauth-callback:
    get:
      operationId: oauthCallback
      tags: [connections-oauth]
      summary: Medium OAuth redirect handler
      description: |
        Medium redirects here with `?code=…` after the user grants access.
        The backend exchanges the code for an access token, fetches the user's profile,
        stores the token, and responds with an HTML page that posts a `postMessage`
        to `window.opener` and closes the popup.

        **Never call this endpoint directly from client code.**
        It is the redirect_uri registered in the Medium OAuth application.
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: Authorization code from Medium.
        - name: error
          in: query
          schema: { type: string }
          description: Error code when the user denies access (e.g. `access_denied`).
      responses:
        "200":
          description: HTML page that closes the popup via postMessage.
          content:
            text/html:
              schema: { type: string }

  /api/connections/{conn_id}/oauth-start:
    get:
      operationId: cliOauthStart
      tags: [connections-oauth]
      summary: Start browser login for an AI provider
      description: |
        Delegates to the CLI runner to spawn the provider CLI and begin the login flow.

        Returns `flow: "cli_browser"` for Anthropic (loopback OAuth).
        Returns `flow: "device_code"` for OpenAI (RFC 8628 device authorization).
        Returns `available: false` when the CLI runner is unreachable or the CLI is not found.

        Not applicable to blog platforms (Medium, Hashnode, Dev.to).
      parameters:
        - name: conn_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CliConnectionId" }
      responses:
        "200":
          description: Login flow info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthStartResponse" }
              examples:
                anthropic:
                  value:
                    available: true
                    flow: cli_browser
                    url: "https://claude.ai/oauth/authorize?redirect_uri=http://localhost:36403/callback&…"
                    poll_url: "/api/connections/anthropic/cli-login-status"
                    device_code: null
                openai:
                  value:
                    available: true
                    flow: device_code
                    url: "https://auth.openai.com/codex/device"
                    poll_url: "/api/connections/openai/cli-login-status"
                    device_code: "1NFL-253Z0"
                unavailable:
                  value:
                    available: false
                    flow: null
                    url: null
                    poll_url: null
                    device_code: null
        "400":
          description: Connection ID does not support browser login.
        "404":
          description: Unknown connection ID.

  /api/connections/{conn_id}/submit-code:
    post:
      operationId: submitCode
      tags: [connections-oauth]
      summary: Relay loopback callback URL to the CLI
      description: |
        Used only for the `cli_browser` flow (Anthropic).

        After the user authorises on claude.ai, the browser tries to redirect to
        `http://localhost:{PORT}/callback?code=…&state=…`. This redirect fails because
        the port is inside Docker and is not reachable from the host browser.
        The user copies the full address-bar URL and posts it here.

        The backend forwards the URL to the CLI runner, which replays the GET request
        to the CLI's internal HTTP server to complete the token exchange.

        Not used for the `device_code` flow (OpenAI) — the CLI polls internally.
      parameters:
        - name: conn_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CliConnectionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitCodeRequest" }
            example:
              code: "http://localhost:36403/callback?code=abc123&state=xyz789"
      responses:
        "200":
          description: Code accepted and forwarded to CLI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: submitted }
        "400":
          description: Connection ID does not use CLI login.
        "404":
          description: Unknown connection ID.
        "409":
          description: No active login session — start a new one with oauth-start first.
        "503":
          description: CLI runner not reachable.

  /api/connections/{conn_id}/cli-login-status:
    get:
      operationId: cliLoginStatus
      tags: [connections-oauth]
      summary: Poll CLI login completion
      description: |
        Polled by the UI every 2 s after opening the provider auth URL.
        Returns `pending` while the CLI is waiting for the user to complete authorization.
        Returns `connected` (and stores the credential) once the CLI reports success.
        Returns `error` with a reason message on failure.
      parameters:
        - name: conn_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CliConnectionId" }
      responses:
        "200":
          description: Current login status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CliLoginStatus" }
              examples:
                pending:
                  value: { status: pending, username: null, errorMessage: null }
                connected:
                  value: { status: connected, username: "ga84jog@example.com", errorMessage: null }
                error:
                  value: { status: error, username: null, errorMessage: "Login failed" }
        "400":
          description: Connection ID does not use CLI login.

components:
  schemas:

    ConnectionId:
      type: string
      enum: [medium, hashnode, devto, anthropic, openai]

    ConnectionInfo:
      type: object
      required: [id, label, type, authMethod, status]
      properties:
        id:           { $ref: "#/components/schemas/ConnectionId" }
        label:        { type: string, example: "Hashnode" }
        type:         { type: string, enum: [blog, ai] }
        authMethod:   { type: string, enum: [token, oauth_or_token] }
        status:       { type: string, enum: [disconnected, connected, error] }
        username:     { type: string, nullable: true, example: "@acisse" }
        connectedAt:  { type: string, format: date-time, nullable: true }
        errorMessage: { type: string, nullable: true }

    ConnectionListResponse:
      type: object
      required: [connections]
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/ConnectionInfo" }

    SaveTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }

    SaveTokenResponse:
      type: object
      required: [id, status]
      properties:
        id:           { type: string }
        status:       { type: string, enum: [connected, error] }
        username:     { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }

    CliConnectionId:
      type: string
      enum: [anthropic, openai]
      description: Connection IDs that support CLI browser login.

    OAuthStartResponse:
      type: object
      required: [available]
      properties:
        available:   { type: boolean }
        url:         { type: string, nullable: true }
        flow:
          type: string
          nullable: true
          enum: [oauth_popup, cli_browser, device_code, null]
          description: |
            oauth_popup   Standard Authorization Code popup (Medium).
            cli_browser   Loopback OAuth (Anthropic). User copies address-bar URL.
            device_code   RFC 8628 device authorization (OpenAI). CLI polls internally.
        poll_url:
          type: string
          nullable: true
          description: Relative URL to poll every 2 s. Set for cli_browser and device_code flows.
        device_code:
          type: string
          nullable: true
          description: One-time device code (e.g. "1NFL-253Z0"). Only set when flow is device_code.

    SubmitCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            Full address-bar URL from the failed loopback redirect, e.g.
            "http://localhost:36403/callback?code=abc123&state=xyz789"

    CliLoginStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [connected, pending, error]
        username:
          type: string
          nullable: true
          description: Email or handle when status is connected.
        errorMessage:
          type: string
          nullable: true
          description: Reason string when status is error.
